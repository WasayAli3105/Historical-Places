<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="Contact.css">
</head>
<body>
    <div class="container">
        <form>
          <h1>CONTACT US</h1>
          <input type="text" id="firstName" placeholder="NAME" required />
          <input type="text" id="lastName" placeholder="PASSWORD" required />
          <input type="email" id="email" placeholder="CONTACT" required />
          <input type="text" id="mobile" placeholder="EMAIL" required />
          <h4>WRITE FOR US</h4>
          <textarea required></textarea>
          <input type="submit" value="SUBMIT" id="button" />
        </form>
      </div>

</body>
</html>
